<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="24" fill="#FBF8F0"/>
  <!-- graph paper lines -->
  <g stroke="#C6D2E8" stroke-width="1.5" opacity="0.8">
    <line x1="0" y1="48" x2="192" y2="48"/>
    <line x1="0" y1="96" x2="192" y2="96"/>
    <line x1="0" y1="144" x2="192" y2="144"/>
    <line x1="48" y1="0" x2="48" y2="192"/>
    <line x1="96" y1="0" x2="96" y2="192"/>
    <line x1="144" y1="0" x2="144" y2="192"/>
  </g>
  <!-- red margin line -->
  <line x1="26" y1="0" x2="26" y2="192" stroke="#D6455B" stroke-width="2.5" opacity="0.55"/>
  <!-- dashed measure line -->
  <line x1="68" y1="132" x2="140" y2="56" stroke="#2B6CB0" stroke-width="3.5" stroke-dasharray="7 6" stroke-linecap="round"/>
  <!-- points: pencil (graphite) and red pen -->
  <circle cx="68" cy="132" r="14" fill="#1C1C1E"/>
  <circle cx="140" cy="56" r="14" fill="#D6455B"/>
</svg>
